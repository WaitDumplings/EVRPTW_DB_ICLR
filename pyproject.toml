[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "evrptw-db"
version = "0.1.0"
description = "Anonymous EVRP-TW-D/B research and review distribution"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.3.5", "pandas==3.0.5", "pyarrow==24.0.0", "scipy==1.17.0", "networkx==3.6.1", "PyYAML==6.0.2", "tqdm==4.67.1"]
[project.optional-dependencies]
learning = ["torch>=2.5,<2.6", "gymnasium==1.3.0", "numba==0.64.0", "safetensors==0.7.0"]
geographic = ["geopandas==1.1.3", "osmnx==2.1.0", "shapely==2.1.2", "folium>=0.20,<1", "matplotlib>=3.8,<4", "pillow>=10,<13", "pyogrio>=0.9,<1", "requests>=2.31,<3"]
gurobi = ["gurobipy>=12,<13"]
test = ["pytest==8.3.4"]
[project.scripts]
evrptw-db = "evrptw_db.cli:main"
evrptw-stage2 = "evrptw_stage2.cli:main"
evrptw-cle = "evrptw_cle.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
